<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prisma">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2340"/>
      <stop offset="1" stop-color="#1a1626"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <!-- incoming white beam -->
  <path d="M7 25 L27 30" stroke="url(#beam)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- refracted spectrum, red (least bent) to violet (most) -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M34 33 L58 27.5" stroke="#d8574a"/>
    <path d="M34 33.6 L58 31" stroke="#d9a13c"/>
    <path d="M34 34.2 L58 34.6" stroke="#4caf7d"/>
    <path d="M34 34.8 L58 38.2" stroke="#3fa8bf"/>
    <path d="M34 35.4 L57.5 41.8" stroke="#5487d8"/>
    <path d="M34 36 L56.5 45.4" stroke="#8b5fd6"/>
  </g>
  <!-- glass prism, apex up -->
  <path d="M27 15 L40 39 L14 39 Z" fill="#ffffff" fill-opacity="0.06"
        stroke="#c9c3ec" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
